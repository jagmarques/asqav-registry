name: validate-registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # jsonschema is required, not optional: validate.py degrades to a NOTE when it is
      # absent, and a registration PR must not pass on a skipped schema check.
      - run: pip install jsonschema==4.26.0
      - run: npm ci --prefix tests/typescript-consumer
      - run: python3 validate.py
      - name: Fail if the schema check was skipped
        run: |
          if python3 validate.py 2>&1 | grep -q "jsonschema not installed"; then
            echo "schema validation was skipped; refusing to pass"
            exit 1
          fi
      - name: Validate wire vocabulary reference
        run: python3 vocabulary/validate.py
      - name: Test wire vocabulary validation
        run: python3 -m unittest discover -s tests -p 'test_wire*.py'
      - name: Check generated wire vocabulary
        run: python3 tools/wire_vocabulary.py --check
      - name: Compile and run generated TypeScript
        run: npm test --prefix tests/typescript-consumer
